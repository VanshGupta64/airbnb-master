spring.application.name=AirBnb

# DB Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/airbnb
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.servlet.context-path=/api/v1
server.port=8080

# JWT Secret
jwt.secretKey=your_very_long_and_very_secure_secret_key_here_32_chars

# Frontend URL
frontend.url=localhost:8090

# Stripe Configuration
stripe.secret.key=your_very_long_and_very_secure_secret_key_here_32_chars
stripe.webhook.secret=your_very_long_and_very_secure_secret_key_here_32_chars

# Swagger Configuration
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
